// helpers

const dashes=[],L=200;
for(let i=0;i<40;i++)for(const x of[-1.2,1.2]){const d=box(.08,.02,2,x,0,-i*5+8);d.userData.s=1;dashes.push(d);scene.add(d)}
for(let i=0;i<60;i++){const x=(Math.random()<.5?-1:1)*(3.8+Math.random()*12),d=box(.3+Math.random()*.4,.15,.2,x,0,8-Math.random()*L);dashes.push(d);scene.add(d)}

for(let i=0;i<10;i++){const g=new THREE.Group();g.add(box(4,.8,1.6,0,0,0,grMat),box(2.6,.8,1.6,1,.7,0,grMat));

// dino
const dino=new THREE.Group(),pivot=new THREE.Group();dino.add(pivot);scene.add(dino);
const shadow=new THREE.Mesh(new THREE.CircleGeometry(.8,20),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.18}));

const pivot2=new THREE.Group();

D.forEach(d=>{d.g.position.x=d.x;d.sh.position.x=d.x});

 const buf=Uint8Array.from(atob(B64),c=>c.charCodeAt(0)).buffer;
 new THREE.GLTFLoader().parse(buf,'',g=>{

   const p=g.attributes.position,a=new Float32Array(p.count*3);
   for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i);a[i*3]=x;a[i*3+1]=y;a[i*3+2]=p.getZ(i);X0=Math.min(X0,x);X1=Math.max(X1,x);Y0=Math.min(Y0,y);Y1=Math.max(Y1,y)}

const obs=[];
function cactus(){const g=new THREE.Group(),n=1+(Math.random()*3|0);let H=0;
 for(let i=0;i<n;i++){const h=1.3+Math.random()*.9,x=(i-(n-1)/2)*.8;H=Math.max(H,h);

function bird(y){const g=new THREE.Group(),w1=new THREE.Group(),w2=new THREE.Group();

function spawn(){
 [1].forEach(l=>{
  const o=score>250&&Math.random()<.3?bird(Math.random()<.5?.6:1.65):cactus();

// game state

function start(){obs.forEach(o=>scene.remove(o));obs.length=0;score=0;speed=16;lane=1;vy=py=0;gap=12;nTarget=0;

function die(){state='over';overAt=t;D.forEach(d=>d.g.rotation.z=.25);hi=Math.max(hi,Math.floor(score));

const mv=()=>{};

 if(asking){if(k==='Enter'){hi=0;try{localStorage.setItem('dinoHi',0)}catch(e){}asking=false;paused=false;ask.style.display='none'}e.preventDefault();return}
 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k))e.preventDefault();

  if(duckT>0)duckT-=dt;const duck=keys.down||duckT>0;
  D.forEach(d=>{if(duck&&d.py>0)d.vy-=70*dt;d.vy-=38*dt;d.py+=d.vy*dt;if(d.py<=0){d.py=0;d.vy=0}
